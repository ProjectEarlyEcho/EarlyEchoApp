name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  sync-database:
    runs-on: ubuntu-latest
    env:
      SYNC_TEST_DATABASE_URL: postgresql://sync_test:sync_test@localhost:5432/earlyecho_sync_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native disposable PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE sync_test LOGIN SUPERUSER PASSWORD 'sync_test'"
          sudo -u postgres createdb -O sync_test earlyecho_sync_test
      - name: Test mobile migrations, replay concurrency, and owner policies
        run: python3 supabase/tests/test_sync_integrity.py

  dashboard:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci

      - name: Lint dashboard
        run: npm run lint

      - name: Test dashboard
        run: npm test

      - name: Build dashboard
        run: npm run build

  n8n-automations:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: n8n

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate care automations
        run: npm run test:all

  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-apk:
    needs: analyze-and-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: earlyecho-apk
          path: build/app/outputs/flutter-apk/app-release.apk
